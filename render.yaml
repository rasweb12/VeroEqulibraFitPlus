services:
  - type: web
    name: vero-equilibrafit-api
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./backend/VeroEqulibraFit.Api/Dockerfile
    dockerContext: .
    healthCheckPath: /health
    autoDeployTrigger: off
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: ConnectionStrings__Postgres
        sync: false
      - key: Database__ConnectionString
        sync: false
      - key: Jwt__Issuer
        value: vero-equilibrafit-api
      - key: Jwt__SigningKey
        sync: false
      - key: PublicApp__BaseUrl
        sync: false
      - key: AI__BaseUrl
        fromService:
          type: pserv
          name: vero-equilibrafit-ai
          property: hostport
      - key: AI__InternalApiKey
        fromService:
          type: pserv
          name: vero-equilibrafit-ai
          envVarKey: VERO_EQUILIBRAFIT_INTERNAL_API_KEY
  - type: pserv
    name: vero-equilibrafit-ai
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./ai/vero_equilibrafit_ai/Dockerfile
    dockerContext: ./ai/vero_equilibrafit_ai
    healthCheckPath: /health
    autoDeployTrigger: off
    envVars:
      - key: PORT
        value: "8001"
      - key: VERO_EQUILIBRAFIT_ENVIRONMENT
        value: production
      - key: VERO_EQUILIBRAFIT_INTERNAL_API_KEY
        generateValue: true
      - key: VERO_EQUILIBRAFIT_GEMINI_API_KEY
        sync: false
      - key: VERO_EQUILIBRAFIT_GEMINI_MODEL
        value: gemini-3.5-flash-lite
  - type: web
    name: vero-equilibrafit-admin
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./admin/VeroEqulibraFit.Admin/Dockerfile
    dockerContext: .
    healthCheckPath: /
    autoDeployTrigger: off
