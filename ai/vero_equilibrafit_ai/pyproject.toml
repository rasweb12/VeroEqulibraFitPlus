[project]
name = "vero-equilibrafit-ai"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = ["fastapi>=0.116.0,<0.117.0", "httpx>=0.28.0,<0.29.0", "uvicorn[standard]>=0.35.0,<0.36.0", "pydantic-settings>=2.10.0,<3.0.0", "google-genai>=1.0.0,<3.0.0"]
[project.optional-dependencies]
dev = ["pytest>=8.4.0,<9.0.0", "ruff>=0.12.0,<1.0.0"]
[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
[tool.ruff]
line-length = 120
