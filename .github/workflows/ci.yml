name: validation

on:
  push:
    branches: [main, 'codex/**']
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore VeroEqulibraFit.slnx
      - run: dotnet build VeroEqulibraFit.slnx --no-restore --configuration Release
      - run: dotnet test VeroEqulibraFit.slnx --no-build --configuration Release
  mobile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile/vero_equilibrafit_app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
  ai:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ai/vero_equilibrafit_ai
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install '.[dev]'
      - run: ruff check .
      - run: pytest
